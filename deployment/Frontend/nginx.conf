server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Serve static files
    location / {
        try_files $uri $uri/ =404;
    }

    # Proxy API requests to the Backend Render service
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass https://askmynotes-api-latest.onrender.com;
        proxy_set_header Host askmynotes-api-latest.onrender.com;
        proxy_ssl_server_name on;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
